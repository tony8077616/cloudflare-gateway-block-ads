# 廣告/追蹤器清單來源設定
# 格式：name|url|format
# format 可選：domains（純網域清單）/ adblock（AdBlock Plus 語法）/ hosts（hosts 檔格式）
#   留空或寫 auto：依下載到的內容自動偵測（三種解析器各跑一次，解析出最多網域的勝出）
#   明確寫出格式時完全不偵測；寫錯的值（例如 adbock）會被拒絕，不會被改成自動偵測
# url 必須是 https://，而且路徑（去掉 ?query 與 #fragment）以 .txt 結尾；下載到的內容也必須是純文字清單
#
# 新增自訂訂閱來源：直接照格式加一行即可，抓取失敗會被略過並記錄警告，
# 不會讓整個同步流程失敗。原網址直連失敗時會自動換一組連線參數再試一次。

