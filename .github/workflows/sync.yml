name: Sync ad-block lists to Cloudflare Gateway

on:
  schedule:
    - cron: "0 18 * * *"   # 每天 UTC 18:00（台灣時間凌晨 2:00）
  workflow_dispatch: {}     # 允許手動觸發

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝相依套件
        run: pip install requests pyyaml

      - name: 執行同步
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN_ADBLOCK }}
          D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: python sync.py
