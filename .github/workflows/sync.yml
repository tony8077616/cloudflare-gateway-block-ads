name: Sync ad-block lists to Cloudflare Gateway

on:
  schedule:
    # 每小時檢查一次訂閱來源。腳本會先比對各來源「解析後輸出」的 checksum，
    # 全部沒變動就直接結束，完全不會呼叫 Cloudflare API，所以大多數執行都很便宜。
    #
    # 刻意不用整點（"0 * * * *"）。GitHub 的排程在負載高的時候會延遲、甚至直接丟掉，
    # 而整點是最擁擠的時刻。這個 repo 實測過：2026-08-22 18:12 到 2026-09-05 00:40
    # 之間跨度約 319 小時，用 "0 * * * *" 只觸發了 40 次（約 12.5%），實際間隔是
    # 4.4、5.2、4.7、4.2、3.0、2.4 小時這樣跳 —— 名義上每小時，實際上三到四小時一次。
    # 改成非整點不會讓它變準時（GitHub 從不保證），但會明顯少被丟掉。
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "略過 checksum 閘門，強制執行完整同步"
        type: boolean
        default: false
      rebuild_cache:
        description: "略過 KV 分類快取快照，從 D1 重讀並重建（快照壞掉時的復原手段）"
        type: boolean
        default: false

# 避免排程跟手動觸發重疊執行，或連續手動觸發時互相干擾同一批 Cloudflare 資源
# （多個 run 同時改 Gateway Lists / Policy 容易互相覆蓋）
concurrency:
  group: sync-ad-block-lists
  cancel-in-progress: false

# 最小權限原則：這個 workflow 只需要讀取 repo 內容，不需要寫入任何 GitHub 資源
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04    # 固定版本，避免 ubuntu-latest 未來悄悄升級造成環境突變
    timeout-minutes: 60
    steps:
      # 釘成 commit SHA 而不是 @v7。v7 是**可變標籤**，上游隨時可以把它移到別的 commit，
      # 而這個 job 的 env 裡有 CF_API_TOKEN_ADBLOCK（Zero Trust / D1 / KV 都是 Edit），
      # 也就是「上游改標籤 → 我的 runner 跑新程式碼 → 那顆 token 就在同一個環境裡」。
      # 釘住之後，上游要換掉這裡執行的程式碼就必須先經過這個 repo 一次明確的 commit。
      # 升級方式：查 actions/checkout 的新 release，把 SHA 與後面的版本註解一起換掉。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          # 預設是 true，會把 GITHUB_TOKEN 寫進 .git/config 的 http.extraheader，
          # 然後留在磁碟上陪著 sync.sh 跑完整趟。這個 workflow 從不推送任何東西，
          # 關掉零成本。
          persist-credentials: false

      # 不需要額外安裝步驟：curl、jq（1.7.1+）、coreutils 都已內建在 ubuntu-24.04 runner image 上

      - name: 執行同步
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN_ADBLOCK }}
          D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          # 分類快取的 KV namespace ID。用 repo variable 而不是 secret：namespace ID 不是
          # 機密，它會出現在每一個 Cloudflare API 路徑裡，設成 secret 只會讓日誌變成
          # 一堆 *** 而難以排查。
          # 沒有設定這個 variable 時，這裡會展開成空字串 —— sync.sh 收到空值就是
          # 「不啟用 KV 快取、直接讀 D1」，結果一樣正確，只是每次同步要多掃約 46 萬列。
          # 設定位置：repo 的 Settings → Secrets and variables → Actions → Variables。
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
          # 只有手動觸發並勾選 force 時才會是 1；排程觸發時 inputs 為空，等同 0
          FORCE_SYNC: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
          REBUILD_CACHE_BLOB: ${{ github.event.inputs.rebuild_cache == 'true' && '1' || '0' }}
        run: |
          chmod +x sync.sh
          # 2>&1 是必要的：sync.sh 的 log/warn 與 ::group:: 標記都寫 stderr，
          # 合併成單一串流才能保證收折標記跟它要包住的內容不會因為緩衝而錯位。
          ./sync.sh 2>&1
