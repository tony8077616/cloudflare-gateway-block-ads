name: CI

# 這個 repo 有 133 項檢查（Worker 邏輯 115、頁面 12、白名單扣除 6），但在這支 workflow
# 之前，全部只有「人記得手動跑」才會跑。
#
# PR #6 修掉的那個回歸 —— 空的白名單會把整份清單扣光、讓全新安裝的第一次同步必定
# 失敗 —— 正是因為當初的白名單比對測試沒有進 repo、也沒有自動執行，才能無聲出貨。
# 補了回歸測試卻不接上自動執行，等於把同一個坑再挖一次。
#
# 這裡不需要任何 secret：三組測試都在本機跑完，不連 Cloudflare、不連網路。
on:
  push:
    branches: [main]
  pull_request:

# push 到 main 與 PR 各觸發一次就好。同一個 ref 上有新的 push 時，
# 取消還在跑的那次 —— 反正結果會被新的取代。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最小權限：只需要讀取程式碼，不寫入任何 GitHub 資源
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04    # 固定版本，理由同 sync.yml：避免 ubuntu-latest 悄悄升級
    timeout-minutes: 10
    steps:
      # SHA 與 sync.yml 釘的是同一顆（v7.0.1）。這支 workflow 的環境裡沒有任何憑證，
      # 所以供應鏈風險遠低於 sync.yml，但版本保持一致比較好一起升級。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      # 逐檔呼叫，不要寫成 `bash -n sync.sh manage.sh setup.sh`。
      # bash 只接受一個腳本檔，後面兩個會變成該腳本的 $1/$2 —— 那兩支完全沒有被
      # 解析，指令卻回傳 0。那是個假綠燈，比沒有檢查更糟。
      - name: shell 語法檢查
        run: |
          # 明寫 set -e，不要依賴 Actions 對 run: 的預設 shell 旗標。
          set -e
          for f in sync.sh manage.sh setup.sh; do
            echo "檢查 $f"
            bash -n "$f"
          done

      # 這一項就是 PR #6 那個回歸的守門員。
      - name: 白名單扣除的回歸測試
        run: bash test/whitelist-empty.test.sh

      # 上面那一項驗的是「白名單是空的時候要放行全部」。
      # 這一項驗的是另一半：「空的」與「讀不到」必須被分開 ——
      # 兩者在程式裡都是零行輸出，但語意相反，混為一談會把使用者
      # 明確放行的網域封回去。2026-09-04/05 線上實際走過這條路。
      - name: 白名單讀取失敗與零筆的分辨
        run: bash test/whitelist-load-failure.test.sh

      # 同一個形狀的另一處，而且後果更大：列舉 Gateway 現有清單失敗如果被當成
      # 「上面還沒有任何清單」，就會在既有 225 份還在的情況下另建一整批、
      # 再把 Policy 改成只指向新的那批。下游兩道空清單守衛都攔不住。
      - name: Gateway 列舉失敗與零份的分辨
        run: bash test/gateway-enumeration.test.sh

      # 同一個形狀的第三處，而且終點是刪除：讀回「每一份」清單成員的那一行原本
      # 沒有任何檢查，jq 的 `?` 把壞回應吞成沒有輸出，整段又跑在背景子行程裡，
      # 離開狀態連被檢查的機會都沒有。而重導向會先把檔案建出來，於是一次暫時性
      # 失敗就變成一份零筆的槽位檔，下游把那些網域重新分配到別的槽位，再把讀錯
      # 的那一份當成「變成空的」送出 DELETE。
      - name: 單一槽位成員讀取失敗與空清單的分辨
        run: bash test/slot-member-read.test.sh

      # 同一個形狀的最後一處，入口在來源端：抓取失敗的來源沒有 parsed_ 檔，
      # build_merged 是 cat parsed_*.txt，它的網域就整個從合併結果消失，接著被
      # 算成「該從 Gateway 移除」。而失敗來源的 checksum 會沿用前次值，下次它抓
      # 成功且內容沒變時閘門會略過整次同步 —— 那些網域要等到別的來源變動才會回來。
      - name: 來源抓取失敗與該來源網域真的消失的分辨
        run: bash test/source-failure-removal.test.sh

      # CRLF 行尾的訂閱來源在 Linux 上會因為解析器以 $ 錨定行尾而解析出 0 筆，而且不報錯。
      # filters.adtidy.org 的兩個來源實際這樣長期沒有生效過。在 Windows 上完全重現不出來
      # （那裡的 grep／gawk／sed 會自己剝 CR），所以這項測試在 CI 上跑才最有意義。
      - name: CRLF 行尾的來源與 LF 解析結果相同
        run: bash test/crlf-source-parsing.test.sh

      # 來源取得的成功定義與連線預案。curl 的離開狀態以前被忽略：--max-time 在傳輸途中
      # 觸發時 curl 以 28 結束「但仍印出 200」，截斷的內容被當成新內容，之後的 304 讓它一直延續。
      # 這項同時釘住：失敗的嘗試不會出現在 build_merged 讀的最上層、上游的 ETag 不能
      # 帶著 TAB／控制字元進 D1 或 curl -H、回應本體與標頭不會進這個公開 repo 的日誌。
      - name: 來源取得的連線預案、TXT 限制與注入防護
        run: bash test/source-fetch-fallback.test.sh

      # 取檔方式③用 curl --doh-url。這一步只證明 runner 的 curl「接受這個選項、DoH 功能有編進去」：
      # 離開狀態 2 是不認得選項、4 是功能沒編進去、0 是不可能成功的請求卻成功了。
      # 它證明不了「確實走 DoH、沒有退回系統 DNS」（.invalid 在系統 DNS 下也是 6），那一點另外在 runner 上實測過。
      # 離線：DoH 伺服器指向 127.0.0.1:9，網域是保留的 .invalid；不帶任何憑證。
      # DoH 請求會讀代理環境變數，所以先清掉，免得結果取決於 runner 的代理設定。
      - name: runner 的 curl 接受 --doh-url
        run: |
          rc=0
          env -u https_proxy -u HTTPS_PROXY -u all_proxy -u ALL_PROXY \
            curl -q --doh-url https://127.0.0.1:9/dns-query --proto '=https' -sS --max-time 10 \
            -o /dev/null -- https://doh-capability.invalid/x.txt 2>/dev/null || rc=$?
          echo "curl 離開狀態：$rc"
          [[ $rc -ne 2 && $rc -ne 4 && $rc -ne 0 ]]

      # 格式欄留空或寫 auto 時，用正在跑的三個解析器投票決定格式。這項釘住：明確寫出的格式
      # 完全不偵測、打錯的格式照舊拒絕、偵測的候選檔不會出現在 build_merged 讀的 parsed_*.txt。
      - name: 來源格式自動偵測
        run: bash test/source-format-detect.test.sh

      # 變動原因以前用 paste -sd'；' 接成一行：全形分號是 3 個位元組，paste -d 每個接縫只吐一個，
      # 日誌上變成亂碼。Ubuntu 的 coreutils 沒有多位元組修補，所以這項在 runner 上跑才最有意義。
      - name: 變動原因的顯示與 Job Summary 跳脫
        run: bash test/change-reasons.test.sh

      # 上面那些驗的是「偵測得到」。這一項驗的是「偵測到之後真的有人中止」——
      # 兩者是不同的事：PR #14 的單元測試全綠時，仍然存在兩個能讓中止形同虛設
      # 的改法（拆掉呼叫端的 if !、把 exit 改成 return），而且都通過 bash -n。
      - name: 中止接線
        run: bash test/abort-wiring.test.sh

      # 這兩項驗的是「token 有沒有真的送到」與「格式不對時有沒有擋下來」。
      # 前者會起一個只綁 127.0.0.1 的小伺服器實際收請求 —— 不連外、不需要憑證。
      - name: Cloudflare 呼叫的 Authorization 標頭
        run: bash test/cf-auth-header.test.sh

      - name: CF_API_TOKEN 格式閘門
        run: bash test/token-gate.test.sh

      # 選用式保活 workflow 是 repo 裡唯一持有寫入權限 token 的 job，
      # 它的每一行結構都由這項測試釘死，並對著模擬的 GitHub API 實際跑一次。
      - name: 選用式保活的守門與行為
        run: bash test/keepalive.test.sh

      - name: Worker 邏輯測試
        run: node worker/test/worker.test.mjs

      - name: 頁面腳本檢查
        run: node worker/test/page.check.mjs
